# Configuration de l'admin (Decap CMS).

backend:
  name: github
  repo: Michael123-poh/Nkolmintag-church
  branch: main
  base_url: https://nkolmintag-auth.yvesmaillore.workers.dev
  auth_endpoint: auth

# Les images ajoutées depuis l'admin sont stockées dans le dépôt GitHub,
# dans public/images/uploads, et servies depuis /images/uploads.
media_folder: "public/images/uploads"
public_folder: "/images/uploads"

locale: "fr"
show_preview_links: false

collections:
  # ─── Réglages globaux : logo, couleurs, lien du direct ─────────
  - name: "settings"
    label: "Réglages du site"
    files:
      - name: "settings"
        label: "Logo, couleurs, lien du direct"
        file: "src/data/content/settings.json"
        fields:
          - { label: "Texte du logo", name: "logoText", widget: "string", required: false, hint: "Affiché si aucune image de logo n'est choisie ci-dessous." }
          - { label: "Image du logo", name: "logoImage", widget: "image", required: false, hint: "Si renseignée, remplace le texte du logo partout sur le site." }
          - { label: "Lien \"Regarder en direct\"", name: "liveUrl", widget: "string", hint: "Lien Facebook ou YouTube vers le direct du culte." }
          - label: "Couleurs du site"
            name: "colors"
            widget: "object"
            fields:
              - { label: "Bordeaux (couleur principale)", name: "bordeaux", widget: "color" }
              - { label: "Or (accents, icônes, lignes)", name: "gold", widget: "color" }
              - { label: "Crème (fond clair)", name: "cream", widget: "color" }

  # ─── Accueil : en-tête (Hero) ──────────────────────────────────
  - name: "hero"
    label: "Accueil — en-tête"
    files:
      - name: "hero"
        label: "En-tête de l'accueil"
        file: "src/data/content/hero.json"
        fields:
          - { label: "Titre — ligne 1", name: "titleLine1", widget: "string" }
          - { label: "Titre — ligne 2", name: "titleLine2", widget: "string" }
          - { label: "Image de fond", name: "backgroundImage", widget: "image" }
          - label: "Horaires affichés (\"Ce dimanche\")"
            name: "schedule"
            widget: "list"
            fields:
              - { label: "Libellé", name: "label", widget: "string" }
              - { label: "Heure", name: "time", widget: "string" }

  # ─── Navigation ─────────────────────────────────────────────────
  - name: "nav"
    label: "Navigation"
    files:
      - name: "nav"
        label: "Menu du site"
        file: "src/data/content/nav.json"
        fields:
          - name: "items"
            label: "Onglets"
            widget: "list"
            fields:
              - { label: "Libellé", name: "label", widget: "string" }
              - { label: "Lien", name: "href", widget: "string", hint: "#ancre sur l'accueil, ou /chemin pour une page dédiée." }

  # ─── Jours de culte ─────────────────────────────────────────────
  - name: "services"
    label: "Jours de culte"
    files:
      - name: "services"
        label: "Jours de culte"
        file: "src/data/content/services.json"
        fields:
          - name: "items"
            label: "Jours"
            widget: "list"
            fields:
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Horaire", name: "time", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Image", name: "image", widget: "image" }

  # ─── Bibliothèque de prédications ───────────────────────────────
  - name: "sermons"
    label: "Prédications"
    files:
      - name: "sermons"
        label: "Bibliothèque de prédications"
        file: "src/data/content/sermons.json"
        fields:
          - name: "items"
            label: "Prédications"
            widget: "list"
            fields:
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Prédicateur", name: "speaker", widget: "string" }
              - { label: "Date", name: "date", widget: "string", hint: "Ex. 27 juillet 2026" }
              - { label: "Image", name: "image", widget: "image" }
              - { label: "Fichier PDF", name: "pdfUrl", widget: "file", required: false }

  # ─── Événements ──────────────────────────────────────────────────
  - name: "events"
    label: "Événements"
    files:
      - name: "events"
        label: "Événements à venir"
        file: "src/data/content/events.json"
        fields:
          - name: "items"
            label: "Événements"
            widget: "list"
            fields:
              - { label: "Mois (3 lettres)", name: "month", widget: "string", hint: "Ex. AVR, AOÛT, SEPT…" }
              - { label: "Jour", name: "day", widget: "string" }
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }

  # ─── Contact ─────────────────────────────────────────────────────
  - name: "contact"
    label: "Contact"
    files:
      - name: "contact"
        label: "Coordonnées"
        file: "src/data/content/contact.json"
        fields:
          - { label: "Adresse", name: "address", widget: "string" }
          - { label: "Téléphone", name: "phone", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "URL de la carte (OpenStreetMap)", name: "mapEmbed", widget: "string" }

  # ─── Réseaux sociaux ─────────────────────────────────────────────
  - name: "socials"
    label: "Réseaux sociaux"
    files:
      - name: "socials"
        label: "Liens réseaux sociaux"
        file: "src/data/content/socials.json"
        fields:
          - name: "items"
            label: "Réseaux"
            widget: "list"
            fields:
              - { label: "Icône", name: "icon", widget: "select", options: ["facebook", "instagram", "youtube", "whatsapp"] }
              - { label: "Libellé", name: "label", widget: "string" }
              - { label: "Lien", name: "href", widget: "string" }

  # ─── Le pasteur ──────────────────────────────────────────────────
  - name: "pastor"
    label: "Le pasteur"
    files:
      - name: "pastor"
        label: "Le pasteur"
        file: "src/data/content/pastor.json"
        fields:
          - { label: "Nom", name: "name", widget: "string" }
          - { label: "Fonction / titre", name: "role", widget: "string" }
          - { label: "Photo (fond transparent recommandé)", name: "image", widget: "image" }

  # ─── À propos — résumé sur l'accueil ────────────────────────────
  - name: "about-short"
    label: "À propos (résumé accueil)"
    files:
      - name: "about-short"
        label: "Résumé sur l'accueil"
        file: "src/data/content/about-short.json"
        fields:
          - { label: "Titre", name: "title", widget: "string" }
          - { label: "Paragraphe — mission", name: "mission", widget: "text" }
          - { label: "Paragraphe — doctrine", name: "doctrine", widget: "text" }

  # ─── À propos — page complète ────────────────────────────────────
  - name: "about-page"
    label: "À propos (page complète)"
    files:
      - name: "about-page"
        label: "Page À propos"
        file: "src/data/content/about-page.json"
        fields:
          - { label: "Chapô (intro)", name: "standfirst", widget: "text" }
          - { label: "Citation mise en avant", name: "quote", widget: "string" }

          - label: "Vision et croyances (un paragraphe par ligne)"
            name: "vision"
            widget: "list"
            hint: "Chaque élément de la liste est un paragraphe affiché sur la page."

          - label: "Biographie du pasteur (un paragraphe par ligne)"
            name: "pastorBio"
            widget: "list"
            hint: "Chaque élément de la liste est un paragraphe affiché sur la page."

          - label: "Historique (chapitres)"
            name: "history"
            widget: "list"
            fields:
              - { label: "Titre du chapitre", name: "title", widget: "string" }
              - { label: "Texte", name: "text", widget: "text" }

          - label: "Le Conseil des diacres"
            name: "deacons"
            widget: "object"
            fields:
              - { label: "Texte d'introduction", name: "intro", widget: "text" }
              - { label: "Leurs missions (une par ligne)", name: "missions", widget: "list" }
              - { label: "Pendant les jours de culte (une par ligne)", name: "serviceDay", widget: "list" }

          - label: "L'école du dimanche"
            name: "sundaySchool"
            widget: "object"
            fields:
              - { label: "Texte d'introduction", name: "intro", widget: "text" }
              - label: "Classes"
                name: "classes"
                widget: "list"
                fields:
                  - { label: "Nom de la classe", name: "name", widget: "string" }
                  - { label: "Âge", name: "age", widget: "string" }
                  - { label: "Description", name: "text", widget: "text" }
              - { label: "Statistiques (effectifs)", name: "stats", widget: "text" }
              - { label: "Nom du directeur", name: "director", widget: "string" }
              - { label: "Texte sur le directeur", name: "directorText", widget: "text" }