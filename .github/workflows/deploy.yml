# Construit le site à chaque modification sur "main" (y compris celles faites
# depuis l'admin) puis l'envoie sur Hostinger par FTP avec lftp : le site
# principal d'un côté, l'admin sur son sous-domaine de l'autre.
#
# Secrets à créer dans GitHub (Settings → Secrets and variables → Actions) :
#   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD,
#   FTP_SITE_DIR  (ex. /public_html/)        FTP_ADMIN_DIR (ex. /public_html/admin/)

name: Déployer sur Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances
        run: npm ci

      - name: Construire le site
        run: npm run build

      - name: Installer lftp
        run: sudo apt-get install -y -qq lftp

      - name: Déployer le site principal
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SITE_DIR: ${{ secrets.FTP_SITE_DIR }}
        run: |
          rm -rf site && cp -a dist site && rm -rf site/admin
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_SERVER" <<EOF
          set ftp:passive-mode true
          set ftp:ssl-allow no
          set net:timeout 30
          set net:max-retries 3
          set net:reconnect-interval-base 3
          set cmd:fail-exit yes
          mirror -R --parallel=1 --verbose=1 site "${FTP_SITE_DIR%/}"
          bye
          EOF

      - name: Déployer l'admin sur son sous-domaine
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_ADMIN_DIR: ${{ secrets.FTP_ADMIN_DIR }}
        run: |
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_SERVER" <<EOF
          set ftp:passive-mode true
          set ftp:ssl-allow no
          set net:timeout 30
          set net:max-retries 3
          set net:reconnect-interval-base 3
          set cmd:fail-exit yes
          mirror -R --parallel=1 --verbose=1 dist/admin "${FTP_ADMIN_DIR%/}"
          bye
          EOF

      # ─── TEMPORAIRE : montre ce que le serveur FTP contient réellement ───
      - name: Diagnostic FTP (temporaire)
        if: always()
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SITE_DIR: ${{ secrets.FTP_SITE_DIR }}
          FTP_ADMIN_DIR: ${{ secrets.FTP_ADMIN_DIR }}
        run: |
          show() {
            echo "=== $1 ==="
            curl -sS --list-only --max-time 30 "ftp://$FTP_SERVER$2" --user "$FTP_USERNAME:$FTP_PASSWORD" || echo "(dossier introuvable ou illisible)"
          }
          show "racine du FTP" "/"
          show "dossier domains" "/domains/"
          show "dossier du site (FTP_SITE_DIR)" "$FTP_SITE_DIR"
          show "dossier admin (FTP_ADMIN_DIR)" "$FTP_ADMIN_DIR"