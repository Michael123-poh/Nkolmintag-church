name: Deploy React App to Hostinger

on:
  push:
    branches:
      - main # Changez en 'master' si votre branche principale s'appelle master

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🔧 Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🔨 Install Dependencies & Build
        run: |
          npm ci
          npm run build

      - name: 📂 Sync files via FTP
        uses: SamKirsch/ftp-deploy-action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/ # Utilisez ./build/ si votre projet utilise Create React App
          server-dir: ./public_html/
          